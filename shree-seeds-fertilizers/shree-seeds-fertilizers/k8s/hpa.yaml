apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shree-seeds
  namespace: shree-seeds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shree-seeds
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
